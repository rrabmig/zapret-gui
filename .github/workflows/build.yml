name: Build desktop

on:
  push:
    branches: [main, "codex/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      update_visual_baselines:
        description: "Regenerate screenshots for review (download artifact and commit intentionally)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  interface:
    name: Interface checks (inert bridge)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend tools (no lifecycle scripts)
        run: npm ci --ignore-scripts
        working-directory: frontend
      - name: Enforce frontend import order
        run: npm run lint
        working-directory: frontend
      - name: Typecheck and build production frontend (100 KiB gzip budget)
        run: npm run build
        working-directory: frontend
      - name: Build component catalog
        run: npm run build-storybook
        working-directory: frontend
      - name: Build isolated fixture application
        run: npm run build:fixtures
        working-directory: frontend
      - name: Install Chromium on the runner
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Compare appearance and test inert application states
        run: npm run test:ui
        working-directory: frontend
        if: ${{ !inputs.update_visual_baselines }}
      - name: Generate reviewable visual baselines (explicit manual run only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_visual_baselines }}
        run: npm run test:ui -- --update-snapshots
        working-directory: frontend
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: frontend-review
          path: |
            frontend/playwright-report/
            frontend/test-results/
            frontend/src/**/test/__screenshots__/
            frontend/storybook-static/
          if-no-files-found: warn
          retention-days: 14

  core:
    name: Offline core checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Unit tests (no engine, no external network probes)
        run: go test -race ./internal/core
      - name: Vet core
        run: go vet ./internal/core ./cmd/catalog-check

  compatibility:
    name: Official strategy format (text only)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - name: Download verified strategy text into runner temp
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/fetch-upstream-fixtures.py "$RUNNER_TEMP/upstream-text"
      - name: Inspect every strategy without executing it
        run: go run ./cmd/catalog-check "$RUNNER_TEMP/upstream-text"

  desktop:
    name: Build ${{ matrix.platform }}
    needs: [core, interface]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows/amd64
            artifact: zapret-gui-windows-amd64
            flags: "-nsis -installscope user"
          - os: macos-15
            platform: darwin/universal
            artifact: zapret-gui-macos-universal
            flags: ""
          - os: ubuntu-24.04
            platform: linux/amd64
            artifact: zapret-gui-linux-amd64
            flags: "-tags webkit2_41"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Linux WebKit build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev build-essential pkg-config
      - name: Install pinned GUI build tool
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0
      - name: Install Windows installer compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis --version=3.11 -y --no-progress
          "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH
      - name: Set Windows resource and installer version
        if: runner.os == 'Windows'
        shell: python
        run: |
          import json, os, pathlib, re
          p = pathlib.Path('wails.json')
          data = json.loads(p.read_text())
          tag = os.environ['GITHUB_REF_NAME'].removeprefix('v')
          version = tag if os.environ['GITHUB_REF_TYPE'] == 'tag' else '0.1.0'
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version):
              raise SystemExit('Windows release tags must be vMAJOR.MINOR.PATCH')
          data['info']['productVersion'] = version
          p.write_text(json.dumps(data, indent=2))
      - name: Compile GUI only
        shell: bash
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
          BUILD_FLAGS: ${{ matrix.flags }}
        run: |
          version="${GITHUB_REF_NAME}"
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then version="0.1.0-${GITHUB_SHA:0:8}"; fi
          wails build -clean -platform "$TARGET_PLATFORM" $BUILD_FLAGS -ldflags "-X main.Version=$version"
      - name: Check Windows bridge lifecycle without starting the app
        if: runner.os == 'Windows'
        run: go test -tags bindings .
      - name: Verify installer, upgrade and uninstall without starting the engine
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/check-windows-installer.ps1
      - name: Package application and documentation
        shell: bash
        env:
          ARTIFACT_NAME: ${{ matrix.artifact }}
        run: |
          python - <<'PY'
          import os, pathlib, shutil
          dest = pathlib.Path('dist') / os.environ['ARTIFACT_NAME']
          if os.environ['RUNNER_OS'] == 'Windows':
              installers = list(pathlib.Path('build/bin').glob('ZapretDesktop-Setup-*-x64.exe'))
              if len(installers) != 1:
                  raise SystemExit('Expected exactly one Windows installer')
              dest.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(installers[0], dest.parent / installers[0].name)
              raise SystemExit(0)
          else:
              shutil.copytree('build/bin', dest)
          for name in ['README.md', 'LICENSE', 'THIRD_PARTY_NOTICES.md']:
              shutil.copy2(name, dest / name)
          shutil.copytree('docs', dest / 'docs')
          shutil.make_archive(str(dest), 'zip', dest.parent, dest.name)
          PY
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.zip
            dist/*-Setup-*.exe
          if-no-files-found: error
          retention-days: 14

  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, compatibility]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Generate distribution checksums
        run: |
          cd dist
          sha256sum *.zip *-Setup-*.exe > SHA256SUMS
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*-Setup-*.exe dist/SHA256SUMS --repo "$GITHUB_REPOSITORY" --draft --generate-notes --title "Zapret Desktop $GITHUB_REF_NAME"
